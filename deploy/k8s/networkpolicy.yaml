apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shark-socket-netpol
  namespace: shark-socket
spec:
  podSelector:
    matchLabels:
      app: shark-socket
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 18000
          protocol: TCP
        - port: 18000
          protocol: UDP
        - port: 18080
          protocol: TCP
        - port: 18081
          protocol: TCP
  # Egress is intentionally unrestricted: the gateway dials out to arbitrary
  # external endpoints (MQTT brokers, CoAP servers, upstream services) on
  # user-configured addresses/ports, so pinning egress to fixed ports or
  # namespaces would break those outbound connections. Ingress stays locked
  # to the three protocol ports above.
  egress:
    - to:
        - namespaceSelector: {}
