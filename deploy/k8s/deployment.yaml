apiVersion: apps/v1
kind: Deployment
metadata:
  name: shark-socket
  namespace: shark-socket
  labels:
    app: shark-socket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shark-socket
  template:
    metadata:
      labels:
        app: shark-socket
    spec:
      serviceAccountName: shark-socket
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shark-socket
          image: shark-socket:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: tcp
              containerPort: 18000
            - name: metrics
              containerPort: 18080
            - name: health
              containerPort: 18081
          env:
            - name: SHARK_TCP_ADDR
              value: "0.0.0.0:18000"
            - name: SHARK_METRICS_ADDR
              value: "0.0.0.0:18080"
            - name: SHARK_HEALTH_ADDR
              value: "0.0.0.0:18081"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
