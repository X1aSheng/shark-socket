services:
  shark-socket:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    ports:
      # Only the device-facing TCP port is published. Metrics (18080) and
      # health (18081) are unauthenticated and stay container-internal; if you
      # need them on the host (local debugging), map them explicitly, e.g.
      #   - "18080:18080"
      #   - "18081:18081"
      - "18000:18000"
    environment:
      SHARK_TCP_ADDR: 0.0.0.0:18000
      SHARK_METRICS_ADDR: 0.0.0.0:18080
      SHARK_HEALTH_ADDR: 0.0.0.0:18081
      SHARK_MQTT_BROKER: tcp://mosquitto:1883
    read_only: true
    tmpfs:
      - /tmp
      - /var/log
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:18081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      mosquitto:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mqtt-test:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: build
    environment:
      SHARK_MQTT_BROKER: tcp://mosquitto:1883
    command: go test ./internal/infra/mqtt -v -count=1 -timeout 30s
    depends_on:
      mosquitto:
        condition: service_healthy
    profiles:
      - test

volumes:
  mosquitto-data:
