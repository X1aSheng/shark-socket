replicaCount: 2

image:
  repository: shark-socket-new
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 18000

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
