replicaCount: 2

image:
  repository: shark-socket
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 18000
  metricsPort: 18080
  healthPort: 18081

config:
  tcpAddr: "0.0.0.0:18000"
  metricsAddr: "0.0.0.0:18080"
  healthAddr: "0.0.0.0:18081"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
