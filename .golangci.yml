version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
  exclusions:
    paths:
      - examples/
      - tests/stress/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
      # Deprecated pion/dtls API — tracked separately
      - linters:
          - staticcheck
        text: "SA1019:"
      # Pre-existing minor issues
      - linters:
          - staticcheck
        text: "SA6001:"
      - linters:
          - staticcheck
        text: "SA9003:"
formatters:
  enable:
    - gofmt
    - goimports
run:
  timeout: 5m
