version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
  exclusions:
    paths:
      - examples/
formatters:
  enable:
    - gofmt
    - goimports
run:
  timeout: 5m
issues:
  exclude-rules:
    # Test files: suppress noisy checks that overwhelm real issues
    - path: _test\.go
      linters:
        - errcheck
        - unused
    # Generated/stress test code
    - path: tests/stress/
      linters:
        - errcheck
    # Deprecated pion/dtls API — tracked separately
    - linters:
        - staticcheck
      text: "SA1019:"
    # Suppression examples:
    - linters:
        - staticcheck
      text: "SA6001:"
