version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
  exclusions:
    paths:
      - examples/
      - tests/stress/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
          - ineffassign
      # SA4006: value never used in test file
      - linters:
          - staticcheck
        text: "SA4006:"
      # Pre-existing errcheck in non-test code (deferred Close etc.)
      - path: internal/transport/
        linters:
          - errcheck
      - path: scripts/
        linters:
          - errcheck
      # Deprecated pion/dtls API — tracked separately
      - linters:
          - staticcheck
        text: "SA1019:"
      # Pre-existing minor issues
      - linters:
          - staticcheck
        text: "SA6001:"
      - linters:
          - staticcheck
        text: "SA9003:"
      # SA1012: nil context passed in test files
      - linters:
          - staticcheck
        text: "SA1012:"
      # SA4000: identical expressions in test
      - linters:
          - staticcheck
        text: "SA4000:"
      # QF1003: tagged switch style in existing code
      - linters:
          - staticcheck
        text: "QF1003:"
formatters:
  enable:
    - gofmt
    - goimports
run:
  timeout: 5m
