name: CI

on:
  push:
    branches:
      - shark-socket-new-main
      - shark-socket-main
      - main
  pull_request:
    branches:
      - shark-socket-new-main
      - shark-socket-main
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security Scan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Scripted unit, integration, and benchmark tests
        run: go run scripts/run_tests.go -mode all -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Validate tests and vet
        shell: pwsh
        run: ./scripts/validate.ps1
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Validate deploy manifests
        shell: pwsh
        run: ./scripts/validate_deploy.ps1

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs-${{ matrix.os }}
          path: logs/
          if-no-files-found: ignore

  race:
    name: Race (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Race validation
        run: go run scripts/run_tests.go -mode race -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Upload race logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: race-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore

  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Coverage validation
        run: go run scripts/run_tests.go -mode cover -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Upload coverage logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore
