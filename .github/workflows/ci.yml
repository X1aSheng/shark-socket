name: CI

on:
  push:
    branches:
      - shark-socket-new-main
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Scripted unit, integration, and benchmark tests
        run: go run scripts/run_tests.go -mode all -timeout 5m

      - name: Validate tests and vet
        shell: pwsh
        run: .\scripts\validate.ps1

      - name: Validate deploy manifests
        shell: pwsh
        run: .\scripts\validate_deploy.ps1

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validation-logs-${{ matrix.os }}
          path: logs/
