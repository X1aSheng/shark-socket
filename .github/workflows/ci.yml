name: CI

on:
  push:
    branches:
      - shark-socket-new-main
      - shark-socket-main
      - main
  pull_request:
    branches:
      - shark-socket-new-main
      - shark-socket-main
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security Scan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  docker-build:
    name: Docker Build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f deploy/docker/Dockerfile -t shark-socket:ci .

  validate-ubuntu:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "nc -z 127.0.0.1 1883 || exit 1"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Unit tests
        run: go run scripts/run_tests.go -mode unit -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Integration tests
        run: go run scripts/run_tests.go -mode integration -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: go vet
        run: go run scripts/run_tests.go -mode vet

      - name: Deploy validation
        run: go run scripts/run_tests.go -mode deploy

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore

  validate-windows:
    name: Validate (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Unit tests (MQTT-dependent tests skipped on Windows)
        run: go run scripts/run_tests.go -mode unit -timeout 5m

      - name: go vet
        run: go run scripts/run_tests.go -mode vet

      - name: Deploy validation
        run: go run scripts/run_tests.go -mode deploy

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-windows-latest
          path: logs/
          if-no-files-found: ignore

  race:
    name: Race (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "nc -z 127.0.0.1 1883 || exit 1"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Race validation
        run: go test -race -v -count=1 -timeout=5m ./api ./cmd/... ./internal/... ./tests/benchmark/... ./tests/deploy/...
        shell: bash
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Upload race logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore

  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "nc -z 127.0.0.1 1883 || exit 1"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Coverage validation
        run: go run scripts/run_tests.go -mode cover -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Upload coverage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore
