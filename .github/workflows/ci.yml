name: CI

on:
  push:
    branches:
      - shark-socket-new-main
      - shark-socket-main
      - main
  pull_request:
    branches:
      - shark-socket-new-main
      - shark-socket-main
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions:write is required for actions/upload-artifact to store the logs;
  # with only contents:read, every other scope (including actions) is denied
  # and the upload steps would 403.
  actions: write

jobs:
  lint:
    name: Lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  security:
    name: Security Scan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  docker-build:
    name: Docker Build & Smoke Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        # Use the default Go module proxy on the runner (fast in GH-hosted CI);
        # the Dockerfile's default GOPROXY is goproxy.cn for China-based builds.
        run: |
          docker build \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            -f deploy/docker/Dockerfile \
            -t shark-socket:ci .

      - name: Smoke test image (healthz on 0.0.0.0 bind)
        run: |
          docker run -d --name shark-socket-smoke -p 18081:18081 shark-socket:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              echo "healthz OK"
              docker rm -f shark-socket-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs shark-socket-smoke || true
          docker rm -f shark-socket-smoke >/dev/null
          echo "healthz not ready within 20s" >&2
          exit 1

  validate-ubuntu:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t '$SYS/#' -C 1 -W 2 || exit 1"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Unit tests
        run: go run scripts/run_tests.go -mode unit -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Integration tests
        run: go run scripts/run_tests.go -mode integration -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: go vet
        run: go run scripts/run_tests.go -mode vet

      - name: Deploy validation
        run: go run scripts/run_tests.go -mode deploy

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore

  validate-windows:
    name: Validate (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Unit tests (MQTT-dependent tests skipped on Windows)
        run: go run scripts/run_tests.go -mode unit -timeout 5m

      - name: go vet
        run: go run scripts/run_tests.go -mode vet

      - name: Deploy validation
        run: go run scripts/run_tests.go -mode deploy

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-logs-windows-latest
          path: logs/
          if-no-files-found: ignore

  race:
    name: Race (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t '$SYS/#' -C 1 -W 2 || exit 1"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Race validation
        # Use the scripted runner so the race package set stays aligned with
        # local validation (go test -race ./... includes ./tests and
        # ./tests/stress, which the previous hard-coded list omitted).
        run: go run scripts/run_tests.go -mode race -timeout 5m
        shell: bash
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Upload race logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: race-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore

  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t '$SYS/#' -C 1 -W 2 || exit 1"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Coverage validation
        run: go run scripts/run_tests.go -mode cover -timeout 5m
        env:
          SHARK_MQTT_BROKER: tcp://localhost:1883

      - name: Upload coverage logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-logs-ubuntu-latest
          path: logs/
          if-no-files-found: ignore
